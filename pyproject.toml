[project]
name = "deepsearch-media"
version = "0.1.0"
description = "Deep Search in Media Library Using Gemma 4 and Qdrant Multivectors — a local, privacy-first multimodal media search engine."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Sarvesh Talele" }]
keywords = ["multimodal", "search", "gemma", "qdrant", "rag", "vector-database", "media"]

dependencies = [
    # --- Web API (serves the Next.js frontend) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # --- Vector database (local mode, no server required) ---
    "qdrant-client>=1.12",
    # --- Gemma 4 runtime (local, via Ollama) ---
    "ollama>=0.4",
    # --- Media extraction ---
    "opencv-python>=4.10",
    "scenedetect>=0.6.4",
    # Fast local audio transcription (one pass vs per-chunk Gemma) for long media
    "faster-whisper>=1.0",
    "Pillow>=10.4",
    "numpy>=1.26,<2.3",
    # --- Caption / subtitle parsing ---
    "srt>=3.5",
    "webvtt-py>=0.5",
    # --- Config & infra ---
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "loguru>=0.7",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
deepsearch = "deepsearch.cli:app"
deepsearch-api = "deepsearch.api.main:run"

[project.urls]
Homepage = "https://github.com/sarveshtalele/deepsearch-media"
Documentation = "https://github.com/sarveshtalele/deepsearch-media/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsearch"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "B008",   # typer uses function calls in argument defaults
    "UP042",  # keep `str, Enum` for broad compatibility / explicitness
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
