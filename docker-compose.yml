# Optional: run Qdrant as a server instead of embedded local mode.
# After `docker compose up -d`, set DEEPSEARCH_QDRANT_URL=http://localhost:6333
# (works with Docker Desktop or OrbStack).
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: deepsearch-qdrant
    ports:
      - "6333:6333"   # REST / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
