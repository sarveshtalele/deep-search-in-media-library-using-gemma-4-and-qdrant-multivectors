name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEEPSEARCH_USE_STUB: "true"   # no model weights / GPU in CI
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv (Python 3.12)
        run: uv venv --python 3.12

      - name: Install (editable + dev)
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q
